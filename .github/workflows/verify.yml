name: Verify TrueWatch Cocos package

on:
  push:
    branches: [main, tw-prod]
  pull_request:

permissions:
  contents: read

concurrency:
  group: cocos-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run verify
        env:
          RELEASE_GIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
