name: Publish TrueWatch npm packages

on:
  push:
    tags:
      - "agent_*"

concurrency:
  group: truewatch-npm-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify package pair
    if: github.repository == 'TrueWatchTech/datakit-cocos'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      - run: npm run verify:release
        env:
          RELEASE_GIT_TAG: ${{ github.ref_name }}
      - run: node scripts/publish-npm-token.mjs --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:release-policy
      - run: npm run test:publish-token
      - run: npm run build
      - run: npm run test:packed

  publish:
    name: Publish base SDK then Session Replay
    needs: verify
    if: github.repository == 'TrueWatchTech/datakit-cocos'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci
      # Both npm packages must trust this repository, workflow and environment.
      # npm >= 11.5.1 uses GitHub OIDC; no npm token secret is needed.
      - name: Publish both inspected tarballs
        run: node scripts/publish-npm-token.mjs --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-release-pair
          path: artifacts/npm-token-release/
          if-no-files-found: ignore
